# /etc/nginx/sites-available/meuloteamento
#
# ⚠️ ATENÇÃO ⚠️
# Este arquivo é o config "base" SEM SSL. O certbot adiciona automaticamente:
#   - listen 443 ssl + cert paths
#   - bloco de redirect HTTP→HTTPS
#
# SE você copiar este arquivo pra cima do /etc/nginx/sites-enabled/meuloteamento,
# RODE LOGO DEPOIS:
#
#   certbot --nginx -d meuloteamento.com -d www.meuloteamento.com -d parquetucano.meuloteamento.com \
#           --non-interactive --agree-tos --register-unsafely-without-email --redirect
#
# Caso contrário, o site fica disponível só em HTTP.
#
# Aceita:
#  - meuloteamento.com (raiz)
#  - www.meuloteamento.com
#  - *.meuloteamento.com (qualquer subdomínio — Next.js middleware roteia)
#  - Domínios customizados (ex: parquetucano.grupogermanos.com.br)
#  - Acesso direto por IP (catch-all)

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Aceita todos os hostnames; o middleware do Next decide o que fazer
    server_name _;

    client_max_body_size 30M;

    access_log /var/log/nginx/meuloteamento-access.log;
    error_log  /var/log/nginx/meuloteamento-error.log;

    # Cabeçalhos de segurança básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads (mapas, fotos, vídeos) — servidos direto do disco com suporte a range
    location /uploads/ {
        alias /var/www/meuloteamento/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        # Suporte a range requests (essencial pra streaming de vídeo)
        # Permite scrubbing / seek no player de vídeo
        location ~* \.(mp4|webm|ogg|mov)$ {
            add_header Cache-Control "public, max-age=2592000";
            add_header Accept-Ranges bytes;
        }
    }

    # Webhook Asaas — preserva corpo bruto
    location = /api/webhooks/asaas {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # Assets estáticos do Next.js (cache longo)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Tudo o mais → Next.js (que recebe o Host original e o middleware roteia)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
